services:
  - type: web
    name: achadinhos-loja
    runtime: node
    plan: free
    buildCommand: "./build.sh"
    startCommand: "node server/entry.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
